# Configuração do Supabase CLI usada só no CI (job "banco" de .github/workflows/ci.yml):
# sobe Postgres + Auth locais, aplica as migrações de ./migrations e roda os testes de RLS.
# Não afeta o projeto em produção.
project_id = "perfin"

[api]
enabled = false

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
