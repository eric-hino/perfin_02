name: Coletar indicadores

# Segunda a sexta às 21h de Brasília (00h UTC de terça a sábado), depois que
# B3 e ANBIMA publicam os dados do dia. Também pode ser disparado à mão.
on:
  schedule:
    - cron: "0 0 * * 2-6"
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Argumentos extras (ex.: --inicio 2000-01-01 ou --somente curvas)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: coletar-indicadores
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: aplicativo/coletor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aplicativo/coletor/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Testes do coletor
        run: python -m pytest -q

      - name: Coletar e gravar no Supabase
        env:
          COLETOR_DATABASE_URL: ${{ secrets.COLETOR_DATABASE_URL }}
          ARGUMENTOS: ${{ github.event.inputs.argumentos }}
        run: |
          # Só aceita argumentos com caracteres seguros (evita injeção pelo campo do disparo manual).
          if [[ -n "$ARGUMENTOS" && ! "$ARGUMENTOS" =~ ^[a-z0-9_,\ \-]+$ ]]; then
            echo "Argumentos inválidos"; exit 1
          fi
          python coletar_indicadores.py $ARGUMENTOS
