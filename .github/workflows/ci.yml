name: CI

# Valida toda PR para o main (e o próprio main depois do merge).
# Os jobs rodam sempre, para que os checks obrigatórios do main fiquem previsíveis.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aplicativo/portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aplicativo/portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Sem variáveis de ambiente de propósito: o build não pode depender de segredos.
      - run: npm run build

  site:
    name: Site (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  coletor:
    name: Coletor (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: aplicativo/coletor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aplicativo/coletor/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  banco:
    name: Banco (migrações e RLS no Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      # Sobe Postgres e Auth locais e aplica aplicativo/supabase/migrations.
      - run: supabase start --workdir aplicativo
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aplicativo/supabase/requirements-dev.txt
      - run: pip install -r aplicativo/supabase/requirements-dev.txt
      - name: Testes de RLS, hook e gatilho
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python -m pytest aplicativo/supabase/testes -q
      - if: always()
        run: supabase stop --workdir aplicativo --no-backup

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
