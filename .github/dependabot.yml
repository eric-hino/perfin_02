# Atualizações semanais de dependências (abrem PRs que passam pelo CI).
version: 2
updates:
  - package-ecosystem: npm
    directory: /aplicativo/portal
    schedule: { interval: weekly }
    # typescript-eslint ainda não suporta TypeScript 7 (o lint do CI aborta).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    # typescript-eslint ainda não suporta TypeScript 7 (o lint do CI aborta).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /aplicativo/coletor
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /aplicativo/supabase
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
